
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secured Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #111a2e 0%, #060913 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      color: #ffffff;
    }

    .card {
      position: relative;
      background: rgba(18, 25, 44, 0.75);
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 28px;
      padding: 35px 25px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 136, 204, 0.2);
    }

    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
    }

    .avatar-glow {
      position: absolute;
      inset: -5px;
      background: linear-gradient(45deg, #00d2ff, #00f2fe, #ff007f, #7928ca);
      border-radius: 50%;
      filter: blur(12px);
      animation: pulseGlow 3s infinite alternate ease-in-out;
    }

    .avatar-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ffffff;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.96); opacity: 0.7; }
      100% { transform: scale(1.06); opacity: 1; }
    }

    .name-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 40%, #00d2ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
      margin-bottom: 6px;
    }

    .badge-3d {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 16px;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4), inset 0 2px 2px rgba(255, 255, 255, 0.3);
      margin-bottom: 18px;
    }

    .desc {
      font-size: 15px;
      font-weight: 600;
      color: #d1d8e0;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .desc span {
      color: #ffd700;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.4);
    }

    .security-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #2ed573;
      margin-bottom: 20px;
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      background-color: #2ed573;
      border-radius: 50%;
      box-shadow: 0 0 10px #2ed573;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    .btn-3d {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      text-decoration: none;
      color: #ffffff;
      background: linear-gradient(180deg, #00b4db 0%, #0083b0 100%);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 0 #005677, 0 15px 25px rgba(0, 180, 219, 0.45);
      transition: all 0.1s ease;
    }

    .btn-3d:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #005677, 0 6px 12px rgba(0, 180, 219, 0.4);
    }

    .timer-text {
      font-size: 13px;
      color: #a4b0be;
      margin-top: 15px;
      font-weight: 600;
    }

    .countdown {
      color: #00f2fe;
      font-weight: 800;
    }

    #blockMessage {
      display: none;
      color: #ff4757;
      font-weight: 900;
      font-size: 18px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar-wrapper">
      <div class="avatar-glow"></div>
      <img src="https://i.ibb.co/1J2HgYpQ/IMG-20261103-094934-226.jpg" alt="ZIYA MALIK" class="avatar-img">
    </div>

    <h1 class="name-title">ZIYA MALIK</h1>
    <div class="badge-3d">★ Official Loot Channel ★</div>

    <p class="desc">
      Join the biggest hub for <span>90% OFF Shopping Deals</span>, Price Drops & Hidden Errors.
    </p>

    <div class="security-status" id="statusContainer">
      <span class="pulse-dot"></span>
      <span id="securityText">Verifying human connection...</span>
    </div>

    <button id="tgBtn" class="btn-3d">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z" fill="#fff"/>
      </svg>
      <span>JOIN TELEGRAM</span>
    </button>
    
    <div id="blockMessage">Automated traffic detected. Access denied.</div>

    <div class="timer-text" id="timerContainer">
      Redirecting in <span id="timer" class="countdown">5</span>s
    </div>
  </div>

  <script>
    const targetLink = "https://t.me/+uL2bs041VKFmNDU1";
    let count = 5;
    let isBotDetected = false;
    let hasRedirected = false;

    if (navigator.webdriver === true || /HeadlessChrome/.test(navigator.userAgent)) {
      isBotDetected = true;
    }

    if (window.outerWidth === 0 && window.outerHeight === 0) {
      isBotDetected = true;
    }

    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl');
    if (!gl) {
      isBotDetected = true;
    }

    let humanInteraction = false;
    const verifyHuman = () => {
      if (!humanInteraction) {
        humanInteraction = true;
        document.getElementById("securityText").innerText = "Human Verified (SSL Secure)";
        document.getElementById("statusContainer").style.color = "#2ed573";
      }
    };

    ['mousemove', 'touchstart', 'scroll', 'keydown'].forEach(evt => {
      window.addEventListener(evt, verifyHuman, { once: true });
    });

    const timerElement = document.getElementById("timer");
    const tgBtn = document.getElementById("tgBtn");
    const blockMessage = document.getElementById("blockMessage");
    const timerContainer = document.getElementById("timerContainer");
    const statusContainer = document.getElementById("statusContainer");

    function executeRedirect() {
      if (hasRedirected) return;
      if (isBotDetected) {
        blockAccess();
        return;
      }
      hasRedirected = true;
      window.location.href = targetLink;
    }

    function blockAccess() {
      tgBtn.style.display = 'none';
      timerContainer.style.display = 'none';
      statusContainer.style.display = 'none';
      blockMessage.style.display = 'block';
    }

    const countdownInterval = setInterval(() => {
      count--;
      if (count > 0) {
        timerElement.innerText = count;
      } else {
        clearInterval(countdownInterval);
        timerElement.innerText = "0";
        executeRedirect();
      }
    }, 1000);

    tgBtn.addEventListener("click", () => {
      if (isBotDetected) {
        blockAccess();
      } else {
        executeRedirect();
      }
    });

    if (isBotDetected) {
      blockAccess();
    }
  </script>
</body>
</html>
