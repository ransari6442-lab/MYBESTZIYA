<div id="timer">5</div>

</button>

</main>

<script>
(() => {
const telegram="https://t.me/+uL2bs041VKFmNDU1";
const timer=document.getElementById("timer");
const cancel=document.getElementById("cancel");
const join=document.getElementById("join");

let seconds=5;
let stopped=false;
let redirected=false;

join.addEventListener("click",()=>{
if(redirected)return;
redirected=true;
join.textContent="OPENING TELEGRAM...";
});

cancel.addEventListener("click",()=>{
stopped=true;
timer.textContent="PAUSED";
cancel.textContent="AUTO REDIRECT CANCELLED";
cancel.disabled=true;
});

const countdown=setInterval(()=>{
if(stopped){clearInterval(countdown);return;}
seconds--;
timer.textContent=seconds;

if(seconds<=0){
clearInterval(countdown);
if(!stopped&&!redirected){
redirected=true;
window.location.replace(telegram);
}
}
},1000);
})();
</script>
